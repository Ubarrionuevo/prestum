# Después de cada deploy de producción, avisa a Bing (IndexNow) las páginas que cambiaron.
# "Cambiaron" = <lastmod> de los últimos 3 días en los sitemaps (fechas en src/config/fechas.ts).
#
# Vercel no crea "deployments" en GitHub para este repo, así que la tarea arranca con cada push
# a main y espera a que https://www.prestum.com.ar/version.txt muestre ese mismo commit.
# También se puede correr a mano: GitHub → Actions → IndexNow → Run workflow.
name: IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      todas:
        description: "Avisar TODAS las URLs de los sitemaps (no solo las que cambiaron)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: true

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Esperar a que producción tenga este commit
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 60); do
            v=$(curl -s -H "Cache-Control: no-cache" "https://www.prestum.com.ar/version.txt?t=$(date +%s)" || true)
            if [ "$v" = "${{ github.sha }}" ]; then echo "Deploy listo ($v)"; exit 0; fi
            echo "Esperando deploy… (producción: ${v:0:7})"; sleep 15
          done
          echo "El deploy no apareció en 15 minutos; no se avisa a IndexNow."; exit 1
      - name: Avisar a IndexNow
        run: node scripts/indexnow.mjs ${{ github.event.inputs.todas == 'true' && '--todas' || '' }}
